<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WM Treinamentos - Sistema de Estande</title>
    
    <!-- PWA & Mobile Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Mobile App Setup -->
    <meta name="theme-color" content="#182216" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WM Treinamentos" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Scripts Oficiais do Firebase Core e Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCK9V6KT7PIWBXgYdr1iTyUh5zhZjeA6Ls",
            authDomain: "wm-treinamentos.firebaseapp.com",
            projectId: "wm-treinamentos",
            storageBucket: "wm-treinamentos.firebasestorage.app",
            messagingSenderId: "1040120710202",
            appId: "1:1040120710202:web:1dddc3d17bacc5e56d2103"
        };

        // Inicializa o Firebase e a instância global do FIRESTORE se ainda não inicializado
        if (typeof firebase !== 'undefined' && (!firebase.apps || !firebase.apps.length)) {
            firebase.initializeApp(firebaseConfig);
            window.dbFirestore = firebase.firestore(); 
        }
    </script>

    <style>
        :root { 
            --militar: #4B5320; --preto: #111111; --vermelho: #CC0000; 
            --laranja: #FF6600; --bg: #1A1C14; --texto: #E6E8EA; --sucesso: #2e7d32; 
        }
        
        .system-switcher { text-align: center; background: var(--preto); padding: 12px; margin: -10px -10px 20px -10px; border-bottom: 3px solid var(--militar); }
        .system-switcher button { width: auto; display: inline-block; background: transparent; color: #fff; border: 1px solid var(--laranja); margin: 0 5px; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .system-switcher button.active { background: var(--laranja); color: var(--preto); }
        
        /* Área da Logo Dinâmica no Cliente */
        .app-header { text-align: center; margin-bottom: 20px; }
        .app-logo { max-width: 120px; max-height: 120px; object-fit: contain; margin: 0 auto; border-radius: 4px; }

        /* Configuração do Carrossel e mídias */
        .carousel-item { min-width: 100%; height: 340px; background: linear-gradient(135deg, #222, #333); color: var(--laranja); box-sizing: border-box; text-align: center; font-weight: bold; font-size: 15px; display: flex; align-items: center; justify-content: center; overflow-y: auto; position: relative; }
        .carousel-item blockquote { margin: 0 !important; width: 100% !important; min-width: 100% !important; max-height: 100% !important; background: white; }
    </style>
</head>
<body class="bg-[#1A1C14] text-[#E6E8EA] antialiased font-['Plus_Jakarta_Sans',sans-serif]">
